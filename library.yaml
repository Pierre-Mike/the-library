default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/
  tools:
    - default: .claude/tools/
    - global: ~/.claude/tools/
  extensions:
    - default: .pi/extensions/
    - global: ~/.pi/agent/extensions/

library:
  skills:
    - name: agent-generator
      description: Generates Claude Code agent configurations using official format, real-world patterns, and best practices for delegation, tool scoping, and multi-agent coordination
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/agent-generator/SKILL.md

    - name: align
      description: Presents a proposed approach in progressive confirmable chunks with recommended decisions and alternatives before implementation begins. Use when aligning on a design, plan, or technical approach before implementation.
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/align/SKILL.md

    - name: auto-optimize
      description: Autonomous overnight skill optimization loop — takes a skill with locked evals and grinds it to peak performance through iterative benchmark-improve-keep/discard cycles on Haiku, with strategy rotation, domain-aware feedback adapters, and git-based isolation
      source: /Users/pierre-mikel/.claude/skills/auto-optimize/SKILL.md
      requires: [skill:tdd-skill-creation]

    - name: canvas-generator-v2
      description: Deterministic Obsidian JSON Canvas generator with Python layout engine. 2500/2500 on 100 evals covering flowcharts, org charts, state machines, CQRS, hexagonal arch, pub-sub, and 15-node mega-architectures
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/canvas-generator-v2/SKILL.md

    - name: deep-research
      description: Conducts rigorous multi-phase deep research using orchestrator-worker architecture with DAG-based planning, parallel agent swarms, democratic evaluation, and adversarial challenge phases
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/deep-research/SKILL.md

    - name: design-an-interface
      description: Generate multiple radically different interface designs for a module using parallel sub-agents
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/design-an-interface/SKILL.md

    - name: edit-article
      description: Edit and improve articles by restructuring sections, improving clarity, and tightening prose
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/edit-article/SKILL.md

    - name: expertise
      description: Teaches any agent to accumulate and retrieve domain expertise across sessions — read before starting work in a domain, write after completing a task where something non-obvious was learned
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/expertise/SKILL.md

    - name: freecad
      description: Generate FreeCAD Python scripts that create 2D sketches and 3D objects programmatically using FreeCAD's Python API
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/freecad/SKILL.md

    - name: ts-axioms
      description: Engineering axioms and canonical tooling choices for TypeScript projects — Biome, Lefthook, bun, Effect-TS, functional core/imperative shell, co-located tests, and enforcement patterns
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/ts-axioms/SKILL.md

    - name: git-guardrails-claude-code
      description: Set up Claude Code hooks to block dangerous git commands before they execute
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/git-guardrails-claude-code/SKILL.md

    - name: grill-me
      description: Interview the user relentlessly about a plan or design until reaching shared understanding
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/grill-me/SKILL.md

    - name: improve-codebase-architecture
      description: Explore a codebase to find architectural improvement opportunities, surface shallow modules, and propose deepening refactors
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/improve-codebase-architecture/SKILL.md

    - name: json-canvas
      description: JSON Canvas format for creating and editing Obsidian .canvas files programmatically with nodes, edges, groups, and layout strategies
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/json-canvas/SKILL.md

    - name: library
      description: Private skill distribution system for installing, using, pushing, and syncing skills, agents, and prompts from a private catalog
      source: https://github.com/Pierre-Mike/the-library/blob/main/SKILL.md

    - name: md-to-pdf
      description: Converts Markdown files to professionally formatted PDF documents using Pandoc with sensible defaults
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/md-to-pdf/SKILL.md

    - name: migrate-to-shoehorn
      description: Migrate test files from `as` type assertions to @total-typescript/shoehorn
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/migrate-to-shoehorn/SKILL.md

    - name: obsidian-vault
      description: Search, create, and manage notes in the Obsidian vault with wikilinks and index notes
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/obsidian-vault/SKILL.md

    - name: pi-extension-generator
      description: Create, debug, and fix pi extensions — TypeScript modules that add custom tools, slash commands, event interceptors, stateful UI widgets, and bash wrappers
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/pi-extension-generator/SKILL.md

    - name: pi-extension-testing
      description: Testing strategies and patterns for pi extensions — unit tests, integration tests with mock ctx, smoke tests, eval datasets, state reconstruction, and document-consistency checks
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/pi-extension-testing/SKILL.md

    - name: pdf-to-md
      description: Converts PDF files to clean well-structured Markdown using marker-pdf for high-accuracy extraction of text, tables, headers, and equations
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/pdf-to-md/SKILL.md

    - name: prd-to-issues
      description: Break a PRD into independently-grabbable GitHub issues using tracer-bullet vertical slices
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/prd-to-issues/SKILL.md

    - name: prd-to-plan
      description: Turn a PRD into a multi-phase implementation plan using tracer-bullet vertical slices, saved as a local Markdown file
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/prd-to-plan/SKILL.md

    - name: request-refactor-plan
      description: Create a detailed refactor plan with tiny commits via user interview, then file it as a GitHub issue
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/request-refactor-plan/SKILL.md

    - name: research-swarm
      description: Orchestrates parallel research across 5 agents with democratic argumentation phase and ranked synthesis of findings
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/research-swarm/SKILL.md

    - name: scaffold-exercises
      description: Create exercise directory structures with sections, problems, solutions, and explainers that pass linting
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/scaffold-exercises/SKILL.md

    - name: setup-pre-commit
      description: Set up Husky pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/setup-pre-commit/SKILL.md

    - name: skill-generator
      description: Generates new Claude Code skills, modifies and improves existing skills, and measures skill performance through evaluation and benchmarking
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/skill-generator/SKILL.md

    - name: tdd
      description: Test-driven development with red-green-refactor loop for building features or fixing bugs
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/tdd/SKILL.md

    - name: tdd-skill-creation
      description: Creates Claude Code skills using test-driven development — design evals first with multi-agent brainstorming, validate against baseline, lock tests, then autonomously iterate the skill until it passes
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/tdd-skill-creation/SKILL.md

    - name: concise
      description: Compresses Claude output to maximum information density — drops articles, filler, pleasantries, hedging, preambles, summaries. Fragments over sentences, hard 150-word cap, exact API term preservation. 92% eval pass rate, ~150 token skill cost.
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/concise/SKILL.md

    - name: triage-issue
      description: Triage a bug by exploring the codebase to find root cause, then create a GitHub issue with a TDD-based fix plan
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/triage-issue/SKILL.md

    - name: ubiquitous-language
      description: Extract a DDD-style ubiquitous language glossary from the current conversation, flagging ambiguities and proposing canonical terms
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/ubiquitous-language/SKILL.md

    - name: vinted-image-gen
      description: Generates staged product images for Vinted listings using Gemini AI with Playwright for session auth
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/vinted-image-gen/SKILL.md

    - name: write-a-prd
      description: Create a PRD through user interview, codebase exploration, and module design, then submit as a GitHub issue
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/write-a-prd/SKILL.md

    - name: write-a-skill
      description: Create new agent skills with proper structure, progressive disclosure, and bundled resources
      source: https://github.com/Pierre-Mike/agentic/blob/main/skills/write-a-skill/SKILL.md

  extensions:
    - name: github-search
      description: Search GitHub repos, issues, and PRs directly from pi. Registers github_search_repos and github_search_issues tools. Works without auth (60 req/h), set GITHUB_TOKEN for 5000 req/h.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/github-search/index.ts

    - name: hn-search
      description: Search Hacker News stories and comments from pi. Registers search_hn tool using the Algolia HN API. No API key needed.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/hn-search/index.ts

    - name: jina-reader
      description: Fetch any URL as clean Markdown from pi. Registers read_url tool using Jina Reader. No API key needed, set JINA_API_KEY for higher rate limits.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/jina-reader/index.ts

    - name: mastra-tools
      description: Register any Mastra tool in pi via .mastra-tools.ts — tools become available to the LLM in every session alongside built-in pi tools. Supports Zod 4 auto-conversion and any createTool() definition.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/mastra-tools/README.md

    - name: mastra-agent-network
      description: Run Mastra agent networks inside pi — /agent-network <task> or run_agent_network tool spins up a routing agent that orchestrates named sub-agents, each with their own model and instructions. Pi OAuth routing used automatically (no vendor API keys needed).
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/mastra-agent-network/README.md

    - name: mastra-workflow
      description: Run Mastra workflows inside pi — /workflow <task> executes sequential, parallel, or branching steps where each step spawns a pi subagent for LLM work. No Mastra API keys needed.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/mastra-workflow/README.md

    - name: mastra-memory
      description: Persists Pi session messages to SQLite via Mastra Memory and injects past context into the system prompt on session start — no embeddings, pure recency recall, one thread per project
      source: /Users/pierre-mikel/Github/agentic/.pi/extensions/mastra-memory/index.ts

    - name: agentic
      description: Config-driven multi-agent orchestration — define Orchestrator, domain-scoped Leads, and Workers in .agentic.yml, then run /do <task> to spawn the full pipeline with hard domain enforcement
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/agentic/README.md

    - name: captain
      description: Multi-step pipeline orchestrator for defining sequential and parallel AI agent workflows with quality gates and failure handling
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/captain/README.md

    - name: claude-modes
      description: Switch between three operating modes (code, plan, review) to control Claude's tool access and behavior constraints
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/claude-modes/README.md

    - name: clear
      description: Wipes conversation context and starts a fresh session with full runtime reload via /clear command
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/clear/README.md

    - name: freecad
      description: Drive FreeCAD from the terminal to create, modify, and batch-export 3D CAD models via natural language
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/freecad/README.md

    - name: free-ai
      description: Toggle free AI providers (Gemini, Groq, Cerebras, HuggingFace, OpenRouter, Mistral, MiniMax, Kimi) with Ctrl+Shift+F. Reads FREE_* env vars and registers one provider per key found.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/free-ai/index.ts

    - name: handoff
      description: Generates comprehensive handoff prompts for the next AI agent with project context, accomplishments, and next steps
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/handoff/README.md

    - name: native-web-search
      description: Powers a web_search tool using Anthropic's native web search with no API keys or external dependencies required
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/native-web-search/README.md

    - name: project-init-claude
      description: Auto-creates .pi/settings.json on session start with global ~/.claude/skills + agents and local .claude/skills + agents for full skill coverage in every new pi project
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/project-init-claude/README.md

    - name: refactor-loop
      description: Iterative refactoring pipeline that runs analyze-refactor-verify cycles with optional git commits and progress tracking
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/refactor-loop/README.md

    - name: repeat
      description: General-purpose loop extension that repeats agent turns automatically in goal-based, fixed-pass, or pipeline-stage modes
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/repeat/README.md

    - name: subagent
      description: Delegate tasks to specialized subagents (scout, planner, worker, reviewer) with isolated context windows. Supports single, parallel, and chained workflows with streaming output and usage tracking.
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/subagent/README.md

    - name: safety-destructive-commands
      description: Intercepts dangerous bash patterns (rm -rf, dd, mkfs, etc.) with confirmation or hard-blocking
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/safety-destructive-commands/README.md

    - name: safety-git-operations
      description: Guards state-changing git and GitHub/GitLab CLI commands with severity-based confirmation and session memory
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/safety-git-operations/README.md

    - name: safety-network-exfiltration
      description: Prevents data exfiltration, remote code execution, and unauthorized network operations via curl/wget/scp/rsync
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/safety-network-exfiltration/README.md

    - name: safety-path-protection
      description: Protects sensitive directories (.git, node_modules, .env, CI/CD configs) from unauthorized access across all tools
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/safety-path-protection/README.md

    - name: voice
      description: Voice input extension using Whisper for local speech-to-text transcription with audio recording overlay
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/voice/voice.ts

    - name: zellij-tab-namer
      description: Automatically renames the active Zellij tab with a short label summarizing the conversation after each agent turn
      source: https://github.com/Pierre-Mike/agentic/blob/main/extensions/zellij-tab-namer/README.md

  agents:
    - name: orchestrator
      description: High-level orchestrator that plans and delegates tasks to scout, planner, worker, and reviewer subagents. Never executes work itself — only coordinates.
      source: https://github.com/Pierre-Mike/agentic/blob/main/agents/orchestrator/orchestrator.md

    - name: planner
      description: Breaks down complex tasks into structured plans with clear steps and dependencies
      source: https://github.com/Pierre-Mike/agentic/blob/main/agents/planner/planner.md

    - name: reviewer
      description: Reviews code, plans, or outputs for quality, correctness, and improvement opportunities
      source: https://github.com/Pierre-Mike/agentic/blob/main/agents/reviewer/reviewer.md

    - name: scout
      description: Explores codebases, files, and directories to gather context and report findings
      source: https://github.com/Pierre-Mike/agentic/blob/main/agents/scout/scout.md

    - name: worker
      description: Executes focused implementation tasks with precision and minimal scope creep
      source: https://github.com/Pierre-Mike/agentic/blob/main/agents/worker/worker.md
  tools:
    - name: scoped-edit
      description: Find-and-replace with path enforcement — validates file is within --scope before editing
      source: https://github.com/Pierre-Mike/agentic/blob/main/tools/scoped-edit/run

    - name: scoped-write
      description: File write with path enforcement — validates file is within --scope before writing
      source: https://github.com/Pierre-Mike/agentic/blob/main/tools/scoped-write/run

    - name: spawn-specialist
      description: One-shot scoped Claude session with hard tool allowlist and optional skill loading
      source: https://github.com/Pierre-Mike/agentic/blob/main/tools/spawn-specialist/run

    - name: word-count
      description: Self-contained MCP tool — counts words, characters, lines in text
      source: https://github.com/Pierre-Mike/agentic/blob/main/tools/word-count/tool.ts

  prompts: []
